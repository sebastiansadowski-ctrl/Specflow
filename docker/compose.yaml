# Kontener z agentem OpenCode dla prototypu (F00). Specflow działa na hoście (`uv run specflow`).
services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile
    image: specflow-opencode:2.2.5
    ports:
      # Tylko lokalnie. Z innego komputera: tunel SSH (ssh -L 4096:127.0.0.1:4096 ...).
      - "127.0.0.1:4096:4096"
    # Utwardzenie kontenera: bez dodatkowych uprawnień jądra, bez eskalacji, z limitami.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 4g
    cpus: 2
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-specflow-local}
    volumes:
      # Jedyny katalog projektu widoczny dla agenta.
      - ../var/projects:/workspace
      # Logowanie do dostawcy modeli (plan ChatGPT) przetrwa restart kontenera.
      - opencode-data:/home/agent/.local/share/opencode
      - opencode-config:/home/agent/.config/opencode

volumes:
  opencode-data:
  opencode-config:
