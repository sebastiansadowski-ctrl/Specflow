# Specflow + laboratorium: osobny projekt compose, niezależny od innych stacków na serwerze.
# Osobna sieć i wolumeny; jedyny port to interfejs Specflow na 127.0.0.1 (ADR-0010);
# żaden kontener nie ma dostępu do docker.sock.
#
#   docker compose build
#   docker compose run --rm opencode opencode auth login     # jednorazowo
#   docker compose up -d
#   http://localhost:8000                                    # na serwerze: tunel SSH
#   docker compose exec lab bash                             # ręczna konsola
#
# Wolumeny (kto co widzi):
#   projects       - wspólny: Specflow (git, szkielet, weryfikacja) + agent (kod)
#   specflow-data  - tylko Specflow: baza SQLite. Agent jej nie widzi, więc nie może
#                    sam "oznaczyć zadań jako Done" z pominięciem weryfikacji.
#   opencode-home  - tylko OpenCode: logowanie do modelu (token ChatGPT)
name: specflow-lab

x-image: &image
  image: specflow-lab:f00
  build:
    context: .
    args:
      AGENT_UID: ${AGENT_UID:-1000}
      AGENT_GID: ${AGENT_GID:-1000}

x-hardening: &hardening
  read_only: true                       # system plików obrazu tylko do odczytu
  cap_drop: [ALL]                       # żadnych dodatkowych uprawnień jądra
  security_opt:
    - no-new-privileges:true            # brak eskalacji (setuid itp.)
  tmpfs:
    - /tmp:size=512m
  pids_limit: 512                       # ochrona przed "fork bomb"
  restart: unless-stopped
  networks: [lab]
  # Zalecane na serwerze współdzielonym z innymi usługami: gVisor (patrz README).
  # runtime: runsc

services:
  specflow:
    <<: *hardening
    image: specflow:f00
    build:
      context: ..
      dockerfile: docker/specflow.Dockerfile
      args:
        AGENT_UID: ${AGENT_UID:-1000}
        AGENT_GID: ${AGENT_GID:-1000}
    depends_on: [opencode]
    environment:
      SPECFLOW_HARNESS: opencode
      SPECFLOW_OPENCODE_URL: http://opencode:4096
      SPECFLOW_OPENCODE_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?ustaw w docker/.env}
    ports:
      - "127.0.0.1:${SPECFLOW_PORT:-8000}:8000"   # tylko localhost (ADR-0010)
    volumes:
      - projects:/workspace             # ta sama ścieżka co u agenta
      - specflow-data:/data             # baza Specflow - poza zasięgiem agenta
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 1g
    cpus: 1

  opencode:
    <<: [*image, *hardening]
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?ustaw w docker/.env}
    volumes:
      - projects:/workspace             # jedyny katalog projektów widoczny dla agenta
      - opencode-home:/home/agent       # logowanie do modelu, cache, konfiguracja
    mem_limit: 4g
    cpus: 2

  lab:
    <<: [*image, *hardening]
    command: ["sleep", "infinity"]
    working_dir: /app
    depends_on: [opencode]
    environment:
      OPENCODE_URL: http://opencode:4096
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?ustaw w docker/.env}
      SPECFLOW_HOST_ROOT: /workspace    # ta sama ścieżka co w kontenerze agenta
      UV_PROJECT_ENVIRONMENT: /home/agent/.venv-specflow
    volumes:
      - ..:/app                         # repo Specflow (kod, testy, fikstury)
      - projects:/workspace
      - lab-home:/home/agent
    mem_limit: 2g
    cpus: 1

networks:
  lab: {}

volumes:
  projects: {}
  specflow-data: {}
  opencode-home: {}
  lab-home: {}
